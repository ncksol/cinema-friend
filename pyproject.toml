[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cinema-friend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "curl_cffi>=0.16,<0.17",
  "lxml>=5.3,<7",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot>=22,<23",
]

[project.optional-dependencies]
dev = [
  "lxml-stubs>=0.5,<1",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
cinema-friend = "cinema_friend.__main__:main"
cinema-friend-smoke = "cinema_friend.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Migrations are read at runtime by Database.migrate(); without this they are absent
# from a built wheel and the first connection to a fresh database has no schema.
"cinema_friend.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cinema_friend"]
